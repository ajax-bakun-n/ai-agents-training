apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: k8s-assistant
  namespace: kagent
spec:
  description: Agent that can inspect and manage Kubernetes resources and search the web
  type: Declarative
  declarative:
    modelConfig: ollama-local
    systemMessage: |
      Always respond in English.
      You are a Kubernetes assistant with web search capability.
      Use k8s tools to inspect cluster resources, check pod status,
      describe workloads, and retrieve logs.
      Use web_search or fetch_url for external documentation or research.
      Always confirm destructive actions before executing them.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: k8s-mcp
          toolNames: []
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: search-mcp
          toolNames: []