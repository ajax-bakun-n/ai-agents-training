apiVersion: v1
kind: ConfigMap
metadata:
  name: a2a-agent-code
  namespace: kagent
data:
  main.py: |
    import uuid
    from datetime import datetime, timezone
    from fastapi import FastAPI, Request
    import uvicorn

    app = FastAPI(title="A2A Agent")

    AGENT_CARD = {
        "name": "Lab4 A2A Agent",
        "description": "Example A2A agent that echoes tasks back to the caller",
        "url": "https://a2a-agent.deeplearning-internal.ajax.systems",
        "version": "1.0.0",
        "capabilities": {"streaming": False, "pushNotifications": False, "stateTransitionHistory": True},
        "defaultInputModes": ["text/plain"],
        "defaultOutputModes": ["text/plain"],
        "skills": [{"id": "echo", "name": "Echo", "description": "Echoes the input text back", "tags": ["demo"]}],
    }

    @app.get("/.well-known/agent.json")
    async def agent_card():
        return AGENT_CARD

    @app.post("/")
    async def handle_rpc(request: Request):
        body = await request.json()
        method = body.get("method", "")
        params = body.get("params", {})
        req_id = body.get("id")
        if method == "tasks/send":
            task_id = params.get("id") or str(uuid.uuid4())
            message = params.get("message", {})
            text = next((p["text"] for p in message.get("parts", []) if p.get("type") == "text"), "")
            return {"jsonrpc": "2.0", "id": req_id, "result": {
                "id": task_id,
                "status": {"state": "completed", "timestamp": datetime.now(timezone.utc).isoformat()},
                "artifacts": [{"parts": [{"type": "text", "text": f"Echo: {text}"}], "index": 0}],
            }}
        return {"jsonrpc": "2.0", "id": req_id, "error": {"code": -32601, "message": f"Method not found: {method}"}}

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-agent
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a2a-agent
  template:
    metadata:
      labels:
        app: a2a-agent
    spec:
      containers:
        - name: agent
          image: python:3.12-slim
          command: [sh, -c]
          args: ["pip install -q fastapi uvicorn && python /app/main.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: a2a-agent-code
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-agent
  namespace: kagent
spec:
  selector:
    app: a2a-agent
  ports:
    - port: 8080
      targetPort: 8080