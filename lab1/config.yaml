binds:
  - port: 3000
    listeners:
      - routes:
          - name: anthropic
            matches:
              - path:
                  pathPrefix: /
                headers:
                  - name: x-provider
                    value:
                      exact: anthropic
            backends:
              - ai:
                  name: anthropic
                  provider:
                    anthropic:
                      model: claude-sonnet-4-6
            policies:
              cors:
                allowOrigins: ["http://localhost:15000"]
                allowHeaders: ["Content-Type", "Authorization", "x-provider"]
              backendAuth:
                key: "$ANTHROPIC_API_KEY"

          - name: openai
            matches:
              - path:
                  pathPrefix: /
                headers:
                  - name: x-provider
                    value:
                      exact: openai
            backends:
              - ai:
                  name: openai
                  provider:
                    openAI:
                      model: gpt-4o-mini
            policies:
              cors:
                allowOrigins: ["http://localhost:15000"]
                allowHeaders: ["Content-Type", "Authorization", "x-provider"]
              backendAuth:
                key: "$OPENAI_API_KEY"

          - name: default
            matches:
              - path:
                  pathPrefix: /
            backends:
              - ai:
                  name: anthropic-default
                  provider:
                    anthropic:
                      model: claude-sonnet-4-6
            policies:
              cors:
                allowOrigins: ["http://localhost:15000"]
                allowHeaders: ["Content-Type", "Authorization", "x-provider"]
              backendAuth:
                key: "$ANTHROPIC_API_KEY"