apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: ollama-local
  namespace: kagent
spec:
  provider: Ollama
  model: qwen3:8b
  ollama:
    host: http://ollama.ollama.svc.cluster.local:11434

---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: anthropic-via-gateway
  namespace: kagent
spec:
  provider: OpenAI
  model: claude-sonnet-4-6
  apiKeySecret: anthropic-api-key
  apiKeySecretKey: ANTHROPIC_API_KEY
  openAI:
    baseUrl: http://agentgateway-proxy.agentgateway-system.svc.cluster.local:3000