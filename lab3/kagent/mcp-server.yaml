apiVersion: v1
kind: ConfigMap
metadata:
  name: search-mcp-code
  namespace: kagent
data:
  server.py: |
    import uvicorn
    from duckduckgo_search import DDGS
    from mcp.server.fastmcp import FastMCP
    from mcp.server.streamable_http import TransportSecuritySettings
    import httpx

    app = FastMCP(
        "search-mcp",
        transport_security=TransportSecuritySettings(enable_dns_rebinding_protection=False),
    )

    @app.tool()
    def web_search(query: str) -> str:
        """Search the web using DuckDuckGo (returns real ranked results)"""
        results = DDGS().text(query, max_results=5)
        if not results:
            return "No results for: " + query
        parts = []
        for r in results:
            parts.append(f"**{r['title']}**")
            parts.append(r.get("body", ""))
            parts.append(f"URL: {r['href']}")
            parts.append("")
        return "\n".join(parts).strip()

    @app.tool()
    async def fetch_url(url: str) -> str:
        """Fetch content from a URL (max 50KB)"""
        async with httpx.AsyncClient() as c:
            r = await c.get(url, follow_redirects=True, timeout=15)
            return r.text[:50000]

    if __name__ == "__main__":
        uvicorn.run(app.streamable_http_app(), host="0.0.0.0", port=8080)
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: search-mcp
  namespace: kagent
spec:
  transportType: http
  httpTransport:
    path: /mcp
    targetPort: 8080
  deployment:
    image: python:3.12-slim
    port: 8080
    cmd: sh
    args: ["-c", "pip install -q 'mcp[http]' httpx duckduckgo-search && python /app/server.py"]
    volumeMounts:
      - name: code
        mountPath: /app
    volumes:
      - name: code
        configMap:
          name: search-mcp-code